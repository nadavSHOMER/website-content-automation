<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Page Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .char-count {
            font-size: 12px;
            color: #999;
            text-align: right;
            margin-top: 5px;
        }

        .ai-section {
            background: #f8f9ff;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .ai-section h3 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-section p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .ai-preview {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .ai-preview.show {
            display: block;
        }

        .ai-preview h4 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .ai-preview .content {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            max-height: 200px;
            overflow-y: auto;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 15px;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-create {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-create:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI-Powered Page Creator</h1>
        <p class="subtitle">Create amazing content for your Strapi website</p>

        <div id="alertBox" class="alert"></div>

        <form id="pageForm">
            <div class="form-group">
                <label for="title">Page Title *</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter an engaging title for your page"
                    required
                    maxlength="255"
                >
                <div class="char-count">
                    <span id="titleCount">0</span>/255
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what this page should be about. This helps the AI generate better content."
                    maxlength="500"
                ></textarea>
                <div class="char-count">
                    <span id="descCount">0</span>/500
                </div>
            </div>

            <div class="ai-section">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    AI Content Generation
                </h3>
                <p>Let AI create engaging content based on your title and description</p>

                <div class="checkbox-group">
                    <input type="checkbox" id="useAI" name="useAI">
                    <label for="useAI">Generate AI content for this page</label>
                </div>

                <button type="button" class="btn-generate" id="generateBtn" disabled>
                    <span id="generateBtnText">Generate AI Content</span>
                </button>

                <div class="ai-preview" id="aiPreview">
                    <h4>AI Generated Content Preview:</h4>
                    <div class="content" id="aiContent"></div>
                </div>
            </div>

            <button type="submit" class="btn-create" id="createBtn">
                <span id="createBtnText">Create Page</span>
            </button>
        </form>
    </div>

    <script>
        // Character counters
        const titleInput = document.getElementById('title');
        const descInput = document.getElementById('description');
        const titleCount = document.getElementById('titleCount');
        const descCount = document.getElementById('descCount');
        const useAICheckbox = document.getElementById('useAI');
        const generateBtn = document.getElementById('generateBtn');
        const aiPreview = document.getElementById('aiPreview');
        const aiContent = document.getElementById('aiContent');
        const pageForm = document.getElementById('pageForm');
        const alertBox = document.getElementById('alertBox');

        let generatedContent = '';

        titleInput.addEventListener('input', () => {
            titleCount.textContent = titleInput.value.length;
            updateGenerateBtn();
        });

        descInput.addEventListener('input', () => {
            descCount.textContent = descInput.value.length;
            updateGenerateBtn();
        });

        useAICheckbox.addEventListener('change', updateGenerateBtn);

        function updateGenerateBtn() {
            const canGenerate = useAICheckbox.checked && titleInput.value.trim().length > 0;
            generateBtn.disabled = !canGenerate;
        }

        function showAlert(message, type = 'info') {
            alertBox.className = `alert alert-${type} show`;
            alertBox.textContent = message;
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        // Generate AI content
        generateBtn.addEventListener('click', async () => {
            if (!titleInput.value.trim()) {
                showAlert('Please enter a title first', 'error');
                return;
            }

            const btnText = document.getElementById('generateBtnText');
            const originalText = btnText.textContent;

            generateBtn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Generating...';

            try {
                // Simulate AI content generation (replace with actual AI API call)
                const content = await generateAIContent(
                    titleInput.value,
                    descInput.value
                );

                generatedContent = content;
                aiContent.innerHTML = content.replace(/\n/g, '<br>');
                aiPreview.classList.add('show');
                showAlert('AI content generated successfully!', 'success');
            } catch (error) {
                showAlert('Failed to generate AI content: ' + error.message, 'error');
            } finally {
                generateBtn.disabled = false;
                btnText.textContent = originalText;
                updateGenerateBtn();
            }
        });

        // Simulated AI content generation (replace with real AI API)
        async function generateAIContent(title, description) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 2000));

            // This is a placeholder - replace with actual AI API integration
            // Example: OpenAI, Claude, Gemini, etc.
            return `<h2>${title}</h2>

<p>Welcome to this comprehensive guide about ${title.toLowerCase()}. ${description ? description + ' ' : ''}This page provides in-depth information and insights to help you understand the topic better.</p>

<h3>Introduction</h3>
<p>In today's fast-paced world, understanding ${title.toLowerCase()} has become increasingly important. This guide will walk you through the essential concepts and practical applications.</p>

<h3>Key Points</h3>
<ul>
    <li>Comprehensive overview of the main concepts</li>
    <li>Practical examples and use cases</li>
    <li>Best practices and recommendations</li>
    <li>Common challenges and solutions</li>
</ul>

<h3>Conclusion</h3>
<p>By exploring ${title.toLowerCase()}, you're taking an important step towards better understanding this topic. We hope this guide has provided valuable insights and practical knowledge.</p>`;
        }

        // Handle form submission
        pageForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const createBtn = document.getElementById('createBtn');
            const btnText = document.getElementById('createBtnText');
            const originalText = btnText.textContent;

            createBtn.disabled = true;
            btnText.innerHTML = '<div class="spinner"></div> Creating...';

            try {
                const articleData = {
                    data: {
                        title: titleInput.value,
                        description: descInput.value || null,
                    }
                };

                // Add AI-generated content if available
                if (useAICheckbox.checked && generatedContent) {
                    articleData.data.blocks = [
                        {
                            __component: 'shared.rich-text',
                            body: generatedContent
                        }
                    ];
                }

                const response = await fetch('/api/articles', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(articleData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Failed to create page');
                }

                const result = await response.json();

                showAlert('Page created successfully! ID: ' + result.data.id, 'success');

                // Reset form
                pageForm.reset();
                titleCount.textContent = '0';
                descCount.textContent = '0';
                generatedContent = '';
                aiPreview.classList.remove('show');
                updateGenerateBtn();

            } catch (error) {
                showAlert('Error creating page: ' + error.message, 'error');
                console.error('Error:', error);
            } finally {
                createBtn.disabled = false;
                btnText.textContent = originalText;
            }
        });
    </script>
</body>
</html>
